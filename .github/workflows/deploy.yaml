name: Build and Deploy to EKS

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            adityarawat1999/chijji-moni-app:${{ github.sha }}
            adityarawat1999/chijji-moni-app:latest

      - name: Trigger infra repo
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.INFRA_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/dev-AdiR/chijji-moni-infra/dispatches \
            -d '{"event_type": "deploy", "client_payload": {"sha": "${{ github.sha }}"}}'
